min_version = "2024.9.5"

# OS-level build dependencies installed via apt (Debian/Ubuntu) or dnf (Fedora/RHEL)
[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:libssl-dev" = "latest"
"apt:valgrind" = "latest"
"apt:libicu-dev" = "latest"
"dnf:gcc" = "latest"
"dnf:gcc-c++" = "latest"
"dnf:libicu" = "latest"
"dnf:make" = "latest"
"dnf:openssl-devel" = "latest"
"dnf:valgrind" = "latest"

[tools]
dotnet = "8.0"
cmake = "4.3"
task = "3.51"
"dotnet:GitVersion.Tool" = "6.4.0"

[tools."http:vnbuild"]
version = "1.3.0-no-ref-dep-manager.1"
postinstall = "chmod +x $MISE_TOOL_INSTALL_PATH/vnbuild"

[tools."http:vnbuild".platforms]
windows-x64 = { url = "https://www.vaughnnugent.com/public/resources/software/builds/vnbuild/5c45b67b82172479f5e57ab79b59553042f50e92/vnbuild/win-x64.tgz", checksum = "sha256:7CFB5A70C93AA5C407F5847992B5984F741B88B51680E0581FDB748E7CE6A779" }
linux-x64 = { url = "https://www.vaughnnugent.com/public/resources/software/builds/vnbuild/5c45b67b82172479f5e57ab79b59553042f50e92/vnbuild/linux-x64.tgz", checksum = "sha256:9C4B616C91AC1FB5B453C800558FEDD7A9135FD5F6ECE76C320E1ADC6B16F881" }
linux-arm64 = { url = "https://www.vaughnnugent.com/public/resources/software/builds/vnbuild/5c45b67b82172479f5e57ab79b59553042f50e92/vnbuild/linux-arm64.tgz", checksum = "sha256:A2D4A8898F194531A7CF919D571F3911E68B8E3D80940BA6B52EA24ECC577BD8" }
osx-x64 = { url = "https://www.vaughnnugent.com/public/resources/software/builds/vnbuild/5c45b67b82172479f5e57ab79b59553042f50e92/vnbuild/osx-x64.tgz", checksum = "sha256:E0B8D988DF79DE2A56BB35CB20873202DEED6C89D9341622875F8B5A14BD56F0" }
osx-arm64 = { url = "https://www.vaughnnugent.com/public/resources/software/builds/vnbuild/5c45b67b82172479f5e57ab79b59553042f50e92/vnbuild/osx-arm64.tgz", checksum = "sha256:B2E7C7A7BBF38F7A8E1810926912A55E3CCED578B0716DE7B1606B9C5B3BF2A9" }

[env]
DOTNET_SYSTEM_GLOBALIZATION_INVARIANT = "1"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"

[tasks.test]
dir = '../'
run = 'vnbuild test --include noscrypt'

[tasks.ci-vnbuild]
dir = '../'
run = 'vnbuild'
