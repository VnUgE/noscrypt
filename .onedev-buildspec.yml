version: 56
jobs:
- name: Git mirror push
  steps:
  - type: PushRepository
    name: Github push sync
    remoteUrl: https://github.com/VnUgE/noscrypt.git
    userName: VnUgE
    passwordSecret: github-access-token
    force: true
    condition: ALWAYS
    optional: false
  - type: PushRepository
    name: Codeberg push sync
    remoteUrl: https://codeberg.org/VnUgE/noscrypt.git
    userName: VnUgE
    passwordSecret: codeberg-access-token
    force: true
    condition: ALWAYS
    optional: false
  triggers:
  - type: TagCreateTrigger
  - type: BranchUpdateTrigger
    userMatch: anyone
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 3600

- name: Windows Testing
  jobExecutor: windows
  steps:
  - type: CommandStep
    name: checkout
    runInContainer: false
    interpreter:
      type: PowerShellInterpreter
      powershell: powershell.exe
      commands: |
        git clone @server_url@/@project_path@ --branch @branch@ @project_name@

        cd @project_name@/ci
        mise trust mise.toml
        mise install
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: run unit tests
    runInContainer: false
    interpreter:
      type: PowerShellInterpreter
      powershell: powershell.exe
      commands: |
        cd @project_name@/ci
        mise test --verbose
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: -master
    userMatch: anyone
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400

- name: Staging build
  jobExecutor: windows
  steps:
  - type: CommandStep
    name: checkout
    runInContainer: false
    interpreter:
      type: PowerShellInterpreter
      powershell: powershell.exe
      commands: |
        git clone @server_url@/@project_path@ --branch @branch@ @project_name@

        cd @project_name@/ci
        mise trust mise.toml
        mise install
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: VNBuild build
    runInContainer: false
    interpreter:
      type: PowerShellInterpreter
      powershell: powershell.exe
      commands: |
        cd @project_name@/ci
        mise ci-vnbuild build --verbose --no-delay --include @project_name@
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: VNBuild mock publish
    runInContainer: false
    interpreter:
      type: PowerShellInterpreter
      powershell: powershell.exe
      commands: |
        cd @project_name@/ci
        mise ci-vnbuild publish --include @project_name@ --verbose
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: develop master
    userMatch: anyone
  jobDependencies:
  - jobName: Windows Testing
    requireSuccessful: true
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400

- name: Ubuntu Tests
  jobExecutor: docker
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    checkoutPath: '@project_name@'
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: ubuntu x64 tests
    runInContainer: true
    image: docker.io/ubuntu:26.04@@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        cd @project_name@/ci

        apt update; apt install -y curl ca-certificates
        chmod +x ./mise
        ./mise bootstrap --yes
        ./mise test --verbose
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: -master
    userMatch: anyone
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400

- name: Fedora Tests
  jobExecutor: docker
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    checkoutPath: '@project_name@'
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: fedora-44 x64 tests
    runInContainer: true
    image: docker.io/fedora:45@@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        cd @project_name@/ci

        chmod +x ./mise
        ./mise bootstrap --yes
        ./mise test --verbose
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: -master
    userMatch: anyone
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400

- name: Publish branch
  jobExecutor: publish-agents
  steps:
  - type: CommandStep
    name: checkout
    runInContainer: false
    interpreter:
      type: PowerShellInterpreter
      powershell: powershell.exe
      commands: |
        git clone @server_url@/@project_path@ --branch @branch@ @project_name@

        cd @project_name@/ci
        mise trust mise.toml
        mise install
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: VNBuild build
    runInContainer: false
    interpreter:
      type: PowerShellInterpreter
      powershell: powershell.exe
      commands: |
        cd @project_name@/ci
        mise ci-vnbuild build --no-delay --include @project_name@
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: VNBuild publish
    runInContainer: false
    interpreter:
      type: PowerShellInterpreter
      powershell: powershell.exe
      commands: |
        cd @project_name@/ci
        mise ci-vnbuild publish --ftp "@secret:ftp_server_address@" --sign --include @project_name@
    runAs: 0:0
    envVars:
    - name: FTP_USERNAME
      value: '@secret:ftp_username@'
    - name: FTP_PASSWORD
      value: '@secret:ftp_password@'
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400
